# render.yaml — Render Blueprint (Free Tier, no persistent disk)
# Note: On Render Free tier, storage (/data) is ephemeral and resets on redeploy/restart.
# For persistent storage across restarts, upgrade to a paid plan and attach a disk at /data.

services:
  - type: web
    name: campuscopilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false                 # Enter manually in Render dashboard
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: DATABASE_PATH
        value: /data/campus.db
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/chroma
      - key: DOCUMENT_STORAGE_PATH
        value: /data/uploads
      - key: ADMIN_PASSWORD
        sync: false                 # Enter manually in Render dashboard
      - key: OFFICER_PASSWORD
        sync: false                 # Enter manually in Render dashboard
    healthCheckPath: /_stcore/health
    autoDeploy: true

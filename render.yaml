# render.yaml — Render Blueprint for AcadFlow
services:
  - type: web
    name: acadflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false                 # Set your private Gemini API key in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_PATH
        value: /data/campus.db
      - key: CHROMA_PERSIST_DIRECTORY
        value: /data/chroma
      - key: DOCUMENT_STORAGE_PATH
        value: /data/uploads
      - key: ADMIN_PASSWORD
        sync: false
      - key: OFFICER_PASSWORD
        sync: false
    healthCheckPath: /_stcore/health
    autoDeploy: true
